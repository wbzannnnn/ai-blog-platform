spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_ai_blog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${DASHSCOPE_MODEL:qwen-plus}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

mybatis-plus:
  mapper-locations: classpath:mappers/*.xml
  type-aliases-package: com.lanou.springaidemo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

app:
  upload:
    dir: ${UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET:local-only-change-this-secret-please-32-chars}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${PORT:8080}
